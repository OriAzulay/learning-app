# GitHub Actions reads workflows only from .github/workflows/.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm # caches ~/.npm keyed on package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + Prettier check)
        run: npm run lint

      - name: Tests (backend + frontend)
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
